<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>객체 전달</title>
</head>
<body>
    <h1>회원 정보 상세</h1>
    <ul>
        <li>이름: <span th:text="${user.name}">이름 없음</span></li>
        <li>이메일: <span th:text="${user.email}">이메일 없음</span></li>
        <li>나이: <span th:text="${user.age}">0</span>세</li>
    </ul>

    <p th:if="${user.age >= 20}" style="color: blue;">성인 인증된 사용자입니다.</p>
    <!--/*<p th:if="${user.age < 20}" style="color: blue;">미성년 사용자입니다.</p>*/-->
	<p th:unless="${user.age >= 20}" style="color: red;"> 미성년 입니다. </p>
</body>
</html>
