<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>써브웨이 - 로그인</title>
    <link rel="stylesheet" th:href="@{/css/member.css}">
</head>
<body>
	<div th:replace="~{fragments/header :: header}"></div>	
<section class="login-container">
    <h1>LOGIN</h1>
    
    <form method="post" th:action="@{/member/login}">
        <div>
            <label for="id">아이디: </label>
            <input type="text" name="username" id="id" placeholder="아이디" required>
        </div>
        <div>
            <label for="pwd">비밀번호: </label>
            <input type="password" name="password" id="pwd" placeholder="비밀번호" required>
        </div>
        
        <div class="button-group">
            <button type="submit" class="btn-login">로그인</button>
            
            <button type="button" class="btn-join" 
                    th:onclick="|location.href='@{/member/join}'|">회원가입</button>
        </div>
    </form>
</section>

<script th:src="@{/js/fail.js}"></script>
</body>
</html>
