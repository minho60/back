# 1. 애플리케이션 식별 정보
# 이 프로젝트의 이름을 정의합니다. 나중에 Spring Cloud나 로그 관리 시 이 이름을 식별자로 사용합니다.
spring.application.name=sb.board.ex01

# 2. View Resolver 설정 (JSP 관련)
# 컨트롤러가 "home"이라는 문자를 리턴하면, 스프링은 아래 경로와 확장자를 붙여 파일을 찾습니다.
# 예: "home" -> /WEB-INF/views/home.jsp
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# 3. MySQL 데이터베이스 연결 설정 (DataSource)
# 사용할 DB 드라이버 클래스를 지정합니다. (MySQL 8.0 이상은 cj가 포함된 경로 사용)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# DB 접속 URL 설정
# localhost:3306 : 내 컴퓨터의 3306번 포트에서 실행 중인 MySQL 접속
# testdb : 접속할 데이터베이스(스키마) 이름
# useSSL=false : 보안 연결(SSL) 미사용 (로컬 개발 시 보통 false)
# serverTimezone=UTC : 서버 시간대를 협정 세계시(UTC)로 설정
# allowPublicKeyRetrieval=true : MySQL 8.0의 보안 인증 방식 허용
# characterEncoding=UTF-8 : 한글 깨짐 방지를 위한 인코딩 설정
spring.datasource.url=jdbc:mysql://localhost:3306/testdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8

# DB 접속 계정 정보
spring.datasource.username=minho
spring.datasource.password=zjajj899

# 4. Spring Boot DevTools 설정
# 코드를 수정하고 저장하면 브라우저가 자동으로 새로고침(Live Reload)되도록 설정합니다.
# (브라우저에 LiveReload 확장 프로그램이 설치되어 있어야 동작합니다.)
spring.devtools.livereload.enabled=true